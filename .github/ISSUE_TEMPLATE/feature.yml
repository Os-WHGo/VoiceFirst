name: Feature or improvement
about: Propose a scoped improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the learner problem rather than an implementation assumption.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and evidence
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach personal audio, passwords or identifiable learner records.
          required: true
