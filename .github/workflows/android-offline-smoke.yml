name: Android offline bundle smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prebuild Android
        run: npm run check:android-prebuild
      - name: Validate autolinking
        run: node scripts/check-android-autolinking.mjs
      - name: Bundle JavaScript and assemble internal APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Inspect bundled assets
        run: |
          test -f mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -l mobile/android/app/build/outputs/apk/release/app-release.apk | grep -E 'index.android.bundle|assets/index.android.bundle'
      - name: Upload internal artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicefirst-offline-internal
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
