# Generates a reviewable npm lockfile on a networked CI runner.
# Deliberately does NOT commit to the PR branch or mutate main.
# The other build workflows must not switch to npm ci until the reviewed
# lockfile is committed, checks pass and compatibility is confirmed.
name: Dependency lockfile review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'mobile/package.json'
      - 'packages/core/package.json'
      - '.github/workflows/dependency-lockfile-review.yml'
permissions:
  contents: read
jobs:
  lockfile-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure no lockfile is being overwritten in the preparatory workflow
        run: test ! -e package-lock.json
      - name: Resolve npm workspaces into a real lockfile (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check root and both workspace entries
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));
            if(lock.lockfileVersion!==3)throw Error("Expected npm lockfile v3");
            for(const key of ["","mobile","packages/core"]){
              if(!lock.packages?.[key])throw Error("Missing npm workspace entry: "+key);
            }
          '
      - name: Install exactly the resolved packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate mobile and shared runtime contracts
        run: |
          npm run check
          npm run check:mobile
          npm run check:expo-config
      - name: Save checksum and reviewable lockfile
        run: sha256sum package-lock.json > package-lock.sha256
      - name: Upload reviewed npm resolution (NOT committed automatically)
        uses: actions/upload-artifact@v4
        with:
          name: voicefirst-reviewed-npm-lock-${{ github.sha }}
          path: |
            package-lock.json
            package-lock.sha256
          retention-days: 7
          if-no-files-found: error
