name: Android internal APK (manual only)
# Never runs on pull requests or pushes. Requires an explicit operator dispatch.
on:
  workflow_dispatch:
    inputs:
      confirm_internal_build:
        description: 'Type BUILD_INTERNAL_APK to acknowledge runner usage; debug build may need Metro'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-android-debug-apk:
    if: ${{ inputs.confirm_internal_build == 'BUILD_INTERNAL_APK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npm run build:core
      - name: Generate Android native project
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_GIT_STATUS: '1'
          CI: '1'
        run: npx --no-install expo prebuild --platform android --no-install --clean
      - name: Build debug APK without release signing
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify APK exists and inspect bundled assets
        run: |
          set -eu
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/voicefirst-apk-contents.txt
          if grep -Eq 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/voicefirst-apk-contents.txt; then
            echo 'A bundled JavaScript/Hermes asset was detected. Offline operation still requires testing.'
          else
            echo 'WARNING: No bundled JS/Hermes asset detected; debug APK likely requires Metro.'
          fi
      - name: Record APK SHA-256
        run: sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk | tee mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: voicefirst-android-debug-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
