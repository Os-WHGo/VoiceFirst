name: Expo 57 patch compatibility experiment (NOT security clearance)
# Runs only when this isolated experiment or its tests change.
# The patch experiment updates a runner-local lockfile, NEVER the PR or main.
on:
  pull_request:
    paths:
      - '.github/workflows/expo57-security-patch-trial.yml'
      - 'scripts/expo57-security-trial.mjs'
      - 'scripts/expo57-lock-delta.mjs'
      - 'packages/core/test/expo57-security-trial.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voicefirst-expo57-security-experiment-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  patch-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original pinned dependencies without executing third-party scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record immutable comparison from checked-in lockfile
        run: node scripts/expo57-security-trial.mjs before
      - name: Try latest allowed Expo 57 family patches in disposable checkout only
        run: npm update --workspace mobile --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Ensure manifest dependencies and tooling were not rewritten
        run: |
          git diff --exit-code -- package.json mobile/package.json packages/core/package.json
          git diff --stat -- package-lock.json
      - name: Compare advisories and enforce Expo 57 / React Native 0.86 bounds
        run: node scripts/expo57-security-trial.mjs after
      - name: Print checksum-verified candidate lockfile delta for inspection (no commit)
        run: node scripts/expo57-lock-delta.mjs
      - name: Reinstall resulting trial lockfile without third-party scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core and security regression tests under trial dependency tree
        run: npm run check
      - name: Mobile TypeScript under trial dependency tree
        run: npm run check:mobile
      - name: Expo configuration under trial dependency tree
        run: npm run check:expo-config
      - name: Metro JS bundle under trial dependency tree
        run: npm run check:mobile-bundle
      - name: No commits, packages or release artifacts
        run: |
          test -z "$(git status --porcelain -- package.json mobile/package.json packages/core/package.json)"
          echo 'Trial is runner-local. PR lockfile untouched; do not interpret a green experiment as security clearance.'
