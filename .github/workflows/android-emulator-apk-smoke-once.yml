
name: Android emulator APK smoke (internal one-shot)

on:
  push:
    branches:
      - codex/voicefirst-initial-source
    paths:
      - .github/workflows/android-emulator-apk-smoke-once.yml
      - scripts/android-emulator-smoke.sh

permissions:
  contents: read
  actions: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Validate emulator smoke script syntax
        run: bash -n scripts/android-emulator-smoke.sh

      - name: Download existing internal APK
        uses: actions/download-artifact@v4
        with:
          name: voicefirst-android-release-candidate-unverified
          run-id: 39514938027
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify candidate source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          producer_sha=$(gh api repos/${{ github.repository }}/actions/runs/39514938027 --jq '.head_sha')
          printf 'APK producer source SHA: %s\nCurrent checkout SHA: %s\n' "$producer_sha" "$GITHUB_SHA"
          if [[ "$producer_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::Existing APK was built from a different source commit. Rebuild and test the matching APK; refusing stale binary validation.'
            exit 1
          fi

      - name: Verify APK checksum
        run: |
          set -eu
          test -s candidate/app-release.apk
          test -s candidate/SHA256SUMS.txt
          sed 's|mobile/android/app/build/outputs/apk/release/app-release.apk|app-release.apk|' candidate/SHA256SUMS.txt > candidate/SHA256SUMS-local.txt
          cd candidate
          sha256sum -c SHA256SUMS-local.txt

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh candidate/app-release.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicefirst-android-emulator-smoke-diagnostics
          path: |
            android-emulator-logcat.txt
            voicefirst-online-logcat.txt
            voicefirst-offline-logcat.txt
            voicefirst-offline-connectivity.txt
            voicefirst-ui-online.xml
            voicefirst-ui-offline.xml
            voicefirst-online.png
            voicefirst-offline.png
            voicefirst-offline-pid.txt
            voicefirst-online-pid.txt
            voicefirst-ui-scroll.xml
            voicefirst-scrolled.png
          if-no-files-found: ignore
          retention-days: 7
